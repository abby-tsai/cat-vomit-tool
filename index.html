<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吐吐紀錄工具</title>
<style>
:root{color-scheme:light dark;--bg:#fbf6ef;--card:#fff;--ink:#3b2f2a;--mute:#8a7a70;--line:#eadfd2;--acc:#e07a5f;--accsoft:#fbe3da;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1916;--card:#2a2420;--ink:#f1e8df;--mute:#a89a8e;--line:#3d342e;--acc:#f09a80;--accsoft:#4a2f26;--on:#2a1a14}}
:root[data-theme="dark"]{--bg:#1d1916;--card:#2a2420;--ink:#f1e8df;--mute:#a89a8e;--line:#3d342e;--acc:#f09a80;--accsoft:#4a2f26;--on:#2a1a14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
.colL,.colR{min-width:0}
@media (min-width:820px){.cols{grid-template-columns:1fr 1fr;align-items:start}}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;background:var(--accsoft);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:24px;color:var(--acc)}
.stat span{font-size:12px;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:14px}
.bar{cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.bar i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.9}
.bar i.z{background:var(--line)}
label.l{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input[type=date],input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.btn{font:inherit;font-weight:600;color:var(--on);background:var(--acc);border:0;border-radius:12px;padding:12px 18px;cursor:pointer;width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);width:auto;margin:0;padding:7px 12px;font-size:13px;font-weight:500}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.add{width:72px;height:72px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--mute);cursor:pointer;background:var(--bg)}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:18px 4px 8px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;background:var(--accsoft);color:var(--acc);border-radius:999px;padding:2px 9px;font-weight:600}
.badge.ok{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.meta{font-size:13px;color:var(--mute);margin-top:6px}
.note{font-size:14px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--mute);padding:26px 0}
.tools{display:flex;justify-content:flex-end;margin-top:10px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:12px}
#rp{position:fixed;inset:0;background:#fff;color:#222;overflow:auto;display:none;z-index:40;padding-top:env(safe-area-inset-top,0px)}
#rpBar{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:13px;color:#666;z-index:1}
#rp .btn.ghost{color:#555;border-color:#ccc}
.calhd{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:11px;color:var(--mute)}
.cd{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;cursor:pointer}
.cd.v{background:var(--accsoft)}
.cd i{font-style:normal;font-size:11px;font-weight:700;background:var(--acc);color:var(--on);border-radius:99px;min-width:16px;padding:0 4px}
.cd em{font-style:normal;color:var(--mute);line-height:.6}
.cd.today{border-color:var(--acc);font-weight:700}
.cd.sel{outline:2px solid var(--acc)}
.vb{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.vb .btn{margin:0;width:auto;flex:1 1 auto}
</style>
</head>
<body>
<main>
  <h1>🐱 吐吐紀錄工具</h1>
  <div class="cols"><div class="colL">

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="sToday">0</b><span>今天嘔吐</span></div>
      <div class="stat"><b id="s7">0</b><span>近 7 天</span></div>
      <div class="stat"><b id="sLast">–</b><span>距上次（天）</span></div>
    </div>
    <div class="chips" id="view" style="margin-top:14px"></div>
    <div id="cal"></div>
    <div class="chart" id="chart" style="display:none"></div>
  </section>

  <div id="hist" style="display:none"><h2 style="margin:4px 4px 0">歷史紀錄</h2>
  <div id="selBar"></div>
  <div id="list"></div></div>
  </div><div class="colR">
  <section class="card">
    <h2>新增紀錄</h2>
    <label class="l" for="d">日期與時間</label>
    <div class="row" style="justify-content:flex-start"><input type="date" id="d" style="flex:1"><select id="h" style="flex:1"></select></div>

    <label class="l">狀況</label>
    <div class="chips" id="kind"></div>

    <label class="l">嘔吐照片</label>
    <div class="thumbs" id="thumbs"></div>
    <input type="file" id="file" accept="image/*" multiple hidden>

    <h2 style="margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line)">其他狀況</h2>
    <label class="l">飼料有沒有換</label>
    <div class="chips" id="food"></div>
    <input type="text" id="foodNote" placeholder="換成什麼飼料／零食？" style="margin-top:8px;display:none">

    <label class="l">食慾</label>
    <div class="chips" id="appetite"></div>

    <label class="l">精神（獨立選擇）</label>
    <div class="chips" id="mood"></div>

    <label class="l" for="note">備註</label>
    <textarea id="note" placeholder="例如：吐之前有吃太快、剛喝完水、有拉肚子…"></textarea>

    <button class="btn" id="save">儲存紀錄</button>
  </section>

  <section class="card" style="margin-top:18px">
    <h2>🩺 給獸醫的報告</h2>
    <div class="chips" id="range"></div>
    <div class="vb">
      <button class="btn" id="vPrev">預覽報告（文字＋照片）</button>
      <button class="btn ghost" id="vCopy">複製文字</button>
      <button class="btn ghost" id="vDl" style="display:none">下載報告檔</button>
    </div>
    <div class="meta" id="vMsg"></div>
    <textarea id="vTxt" readonly style="display:none;margin-top:10px;min-height:140px"></textarea>
  </section>

  
  <div class="tools"><button class="btn ghost" id="export" style="display:none">匯出備份</button></div>
</div></div></main>
<div id="lb"><img alt=""></div>
<div id="rp"><div id="rpBar"><button class="btn ghost" id="rpX">← 返回</button><span>可直接長截圖，傳給獸醫</span></div><div id="rpBody"></div></div>

<script>
const KEY="catvomit:v1";
const KINDS=["吐毛球","吐食物","吐黃水／胃液","吐白泡沫","其他","沒有嘔吐"];
const FOODS=[["same","沒換"],["changed","有換"]];
const APP=[[1,"😿 不吃"],[2,"😕 吃很少"],[3,"😺 普通"],[4,"😸 不錯"],[5,"😻 超愛"]];
const MOODS=["很有活力","正常","較安靜","很沒精神","躲起來"];
let entries=[];
try{entries=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){entries=[]}
const form={kind:KINDS[1],food:"same",appetite:3,mood:"正常",photos:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>dayKey(new Date());
function setNow(){const h=$("h");if(!h.options.length)for(let i=0;i<24;i++)h.add(new Option(i+" 點",pad(i)));$("d").value=todayStr();h.value=pad(new Date().getHours())}
const dayKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isVomit=e=>e.kind!=="沒有嘔吐";
function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch(e){alert("儲存空間不足，請刪除一些舊照片或先匯出備份。");return false}}

function chips(el,opts,key){
  el.innerHTML="";
  opts.forEach(o=>{
    const [v,label]=Array.isArray(o)?o:[o,o];
    const b=document.createElement("button");
    b.type="button";b.className="chip";b.textContent=label;
    b.setAttribute("aria-pressed",String(form[key]===v));
    b.onclick=()=>{form[key]=v;chips(el,opts,key);if(key==="food")$("foodNote").style.display=v==="changed"?"block":"none"};
    el.appendChild(b);
  });
}
function drawForm(){
  chips($("kind"),KINDS,"kind");chips($("food"),FOODS,"food");
  chips($("appetite"),APP,"appetite");chips($("mood"),MOODS,"mood");
  drawThumbs();
}
function drawThumbs(){
  const box=$("thumbs");box.innerHTML="";
  form.photos.forEach((src,i)=>{
    const im=document.createElement("img");im.src=src;im.alt="嘔吐照片";
    im.onclick=()=>{form.photos.splice(i,1);drawThumbs()};
    im.title="點一下移除";box.appendChild(im);
  });
  const a=document.createElement("div");a.className="add";a.textContent="＋";a.onclick=()=>$("file").click();
  box.appendChild(a);
}
function compress(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const m=720,k=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.65));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null)};
    img.src=url;
  });
}
$("file").onchange=async e=>{
  for(const f of e.target.files){const s=await compress(f);if(s)form.photos.push(s)}
  e.target.value="";drawThumbs();
};
$("save").onclick=()=>{
  const t=($("d").value||todayStr())+"T"+$("h").value+":00";
  entries.push({id:Date.now().toString(36),t,kind:form.kind,photos:form.photos.slice(),food:form.food,
    foodNote:form.food==="changed"?$("foodNote").value.trim():"",appetite:form.appetite,mood:form.mood,note:$("note").value.trim()});
  if(!persist()){entries.pop();return}
  form.photos=[];$("note").value="";$("foodNote").value="";setNow();
  drawThumbs();render();
};

function render(){
  const today=new Date(),tk=dayKey(today);
  const counts={};entries.filter(isVomit).forEach(e=>{const k=e.t.slice(0,10);counts[k]=(counts[k]||0)+1});
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:dayKey(d),w:"日一二三四五六"[d.getDay()],n:0})}
  days.forEach(d=>d.n=counts[d.k]||0);
  $("sToday").textContent=counts[tk]||0;
  $("s7").textContent=days.reduce((a,d)=>a+d.n,0);
  const v=entries.filter(isVomit).map(e=>e.t).sort().pop();
  $("sLast").textContent=v?Math.max(0,Math.floor((new Date(tk)-new Date(v.slice(0,10)))/864e5)):"–";
  const max=Math.max(1,...days.map(d=>d.n));
  $("chart").innerHTML=days.map(d=>`<div class="bar" data-k="${d.k}">${d.n||""}<i class="${d.n?"":"z"}" style="height:${d.n?Math.round(d.n/max*62)+6:3}px"></i><span>${d.w}</span></div>`).join("");

  drawCal();let sorted=entries.slice().sort((a,b)=>b.t.localeCompare(a.t));if(SEL)sorted=sorted.filter(e=>e.t.slice(0,10)===SEL);
  if(!sorted.length){$("list").innerHTML='<div class="empty">這天沒有紀錄 🐾</div>';return}
  const groups={};sorted.forEach(e=>(groups[e.t.slice(0,10)]=groups[e.t.slice(0,10)]||[]).push(e));
  $("list").innerHTML=Object.keys(groups).map(k=>{
    const d=new Date(k),n=groups[k].filter(isVomit).length;
    return `<div class="day"><span>${k}（週${"日一二三四五六"[d.getDay()]}）</span><span>嘔吐 ${n} 次</span></div>`+
    groups[k].map(e=>{
      const ap=APP.find(a=>a[0]===e.appetite);
      return `<div class="entry"><div class="row"><span><b>${e.t.slice(11,13)} 點</b> <span class="badge ${isVomit(e)?"":"ok"}">${esc(e.kind)}</span></span><button class="btn ghost" data-del="${e.id}">刪除</button></div>
      <div class="meta">食慾：${ap?ap[1]:"–"}　<br>精神：${esc(e.mood)}<br>飼料：${e.food==="changed"?"有換"+(e.foodNote?"（"+esc(e.foodNote)+"）":""):"沒換"}</div>
      ${e.note?`<div class="note">${esc(e.note)}</div>`:""}
      ${e.photos&&e.photos.length?`<div class="thumbs">${e.photos.map(p=>`<img src="${p}" alt="嘔吐照片" data-big>`).join("")}</div>`:""}</div>`}).join("");
  }).join("");
}
$("list").onclick=e=>{
  const t=e.target;
  if(t.dataset.big!==undefined){$("lb").querySelector("img").src=t.src;$("lb").style.display="flex"}
  const id=t.dataset.del;
  if(id){
    if(t.dataset.armed){entries=entries.filter(x=>x.id!==id);persist();render()}
    else{t.dataset.armed="1";t.textContent="再按一次刪除";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="刪除"}},3000)}
  }
};
$("lb").onclick=()=>{$("lb").style.display="none"};

/* ===== 獸醫報告 ===== */
let SEL=null,VIEW="cal",CM=new Date();CM.setDate(1);
function chipsV(){const el=$("view");el.innerHTML="";[["cal","📅 日曆"],["bar","📊 長條圖"]].forEach(([v,l])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=l;b.setAttribute("aria-pressed",String(VIEW===v));b.onclick=()=>{VIEW=v;chipsV();drawCal()};el.appendChild(b)})}
function drawCal(){
  $("chart").style.display=VIEW==="bar"?"flex":"none";
  const c=$("cal");c.style.display=VIEW==="cal"?"block":"none";
  $("hist").style.display=SEL?"block":"none";const sb=$("selBar");sb.innerHTML=SEL?`<div class="meta" style="margin:8px 4px 0">${SEL} 的紀錄　<button class="btn ghost" id="selX">收合</button></div>`:"";
  if(SEL)$("selX").onclick=()=>{SEL=null;render()};
  if(VIEW!=="cal")return;
  const y=CM.getFullYear(),m=CM.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),tk=todayStr();
  const vc={},ne={};entries.forEach(e=>{const k=e.t.slice(0,10);ne[k]=1;if(isVomit(e))vc[k]=(vc[k]||0)+1});
  let h=`<div class="calhd"><button class="btn ghost" id="cPrev">‹</button><b>${y} 年 ${m+1} 月</b><button class="btn ghost" id="cNext">›</button></div><div class="calg">`+"日一二三四五六".split("").map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<first;i++)h+="<div></div>";
  for(let d=1;d<=n;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`,v=vc[k]||0;
    h+=`<button type="button" class="cd${k===tk?" today":""}${k===SEL?" sel":""}${v?" v":""}" data-k="${k}"><span>${d}</span>${v?`<i>${v}</i>`:ne[k]?"<em>·</em>":""}</button>`}
  c.innerHTML=h+'</div><div class="meta">數字＝當天嘔吐次數；「·」＝有紀錄但沒吐。點日期可篩選下方紀錄。</div>';
  $("cPrev").onclick=()=>{CM=new Date(y,m-1,1);drawCal()};
  $("cNext").onclick=()=>{CM=new Date(y,m+1,1);drawCal()};
  c.querySelectorAll(".cd").forEach(b=>b.onclick=()=>{SEL=SEL===b.dataset.k?null:b.dataset.k;render()});
}
$("chart").onclick=e=>{const b=e.target.closest(".bar");if(b){SEL=SEL===b.dataset.k?null:b.dataset.k;render()}};
let RANGE=14,DL=null;
function chipsR(){const el=$("range");el.innerHTML="";[[7,"近 7 天"],[14,"近 14 天"],[30,"近 30 天"],[0,"全部"]].forEach(([v,l])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=l;b.setAttribute("aria-pressed",String(RANGE===v));b.onclick=()=>{RANGE=v;chipsR()};el.appendChild(b)})}
function picked(){let a=entries.slice().sort((x,y)=>x.t.localeCompare(y.t));if(RANGE){const d=new Date();d.setDate(d.getDate()-RANGE+1);const c=dayKey(d);a=a.filter(e=>e.t.slice(0,10)>=c)}return a}
const apText=n=>{const a=APP.find(x=>x[0]===n);return a?a[1].split(" ")[1]:"–"};
const foodText=e=>e.food==="changed"?"有換"+(e.foodNote?"（"+e.foodNote+"）":""):"沒換";
function summary(a){const v=a.filter(isVomit),days=new Set(a.map(e=>e.t.slice(0,10))).size,avg=a.length?(a.reduce((s,e)=>s+e.appetite,0)/a.length).toFixed(1):"–",fc=a.filter(e=>e.food==="changed");return{v,days,avg,fc}}
function buildText(){const a=picked();if(!a.length)return"";const s=summary(a);
  let t=`貓咪嘔吐紀錄（${a[0].t.slice(0,10)} 至 ${a[a.length-1].t.slice(0,10)}）\n嘔吐 ${s.v.length} 次／有紀錄 ${s.days} 天，平均食慾 ${s.avg}／5\n`;
  t+=s.fc.length?"飼料更換："+s.fc.map(e=>e.t.slice(0,10)+(e.foodNote?" "+e.foodNote:"")).join("、")+"\n":"期間沒有更換飼料\n";
  return t+"\n"+a.map(e=>`${e.t.slice(0,10)} ${e.t.slice(11,13)}點｜${e.kind}｜食慾${apText(e.appetite)}｜精神${e.mood}｜飼料${foodText(e)}${e.note?"｜"+e.note:""}${e.photos&&e.photos.length?"｜照片"+e.photos.length+"張":""}`).join("\n")}
const RCSS=".rpt{font-family:-apple-system,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;color:#222;background:#fff;max-width:680px;margin:0 auto;padding:20px 16px;line-height:1.55}.rpt h1{font-size:20px;margin:0 0 4px}.rpt .sub{color:#666;font-size:13px;margin-bottom:12px}.rpt .sum{background:#f6f1ea;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}.rpt .e{border-top:1px solid #ddd;padding:10px 0;font-size:14px}.rpt .e b{font-size:15px}.rpt .tag{display:inline-block;background:#fbe3da;color:#b5482c;border-radius:99px;padding:1px 9px;font-size:12px;margin-left:6px}.rpt .ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.rpt .ph img{width:48%;max-width:300px;border-radius:8px}";
function buildReport(){const a=picked();if(!a.length)return'<div class="rpt"><p>這個區間沒有紀錄。</p></div>';const s=summary(a);
  return `<style>${RCSS}</style><div class="rpt"><h1>🐱 貓咪嘔吐紀錄</h1><div class="sub">${a[0].t.slice(0,10)} 至 ${a[a.length-1].t.slice(0,10)}</div><div class="sum">嘔吐 <b>${s.v.length}</b> 次，有紀錄 ${s.days} 天；平均食慾 ${s.avg} / 5<br>${s.fc.length?"飼料更換："+s.fc.map(e=>e.t.slice(0,10)+(e.foodNote?"（"+esc(e.foodNote)+"）":"")).join("、"):"期間沒有更換飼料"}</div>`+
  a.map(e=>`<div class="e"><b>${e.t.slice(0,10)} ${e.t.slice(11,13)} 點</b><span class="tag">${esc(e.kind)}</span><br>食慾：${apText(e.appetite)}　精神：${esc(e.mood)}　飼料：${esc(foodText(e))}${e.note?"<br>備註："+esc(e.note):""}${e.photos&&e.photos.length?`<div class="ph">${e.photos.map(p=>`<img src="${p}" alt="">`).join("")}</div>`:""}</div>`).join("")+"</div>"}
$("vPrev").onclick=()=>{$("rpBody").innerHTML=buildReport();$("rp").style.display="block";$("rp").scrollTop=0};
$("rpX").onclick=()=>{$("rp").style.display="none"};
$("vCopy").onclick=async()=>{const t=buildText();if(!t){$("vMsg").textContent="這個區間沒有紀錄。";return}
  try{await navigator.clipboard.writeText(t);$("vTxt").style.display="none";$("vMsg").textContent="已複製文字。文字不含照片，照片請用「預覽報告」截圖傳送。"}
  catch(e){$("vTxt").value=t;$("vTxt").style.display="block";$("vTxt").select();$("vMsg").textContent="無法自動複製，請在下方文字框全選後複製。"}};
$("vDl").onclick=async()=>{if(!picked().length||!DL)return;try{await DL.save({filename:"cat-vomit-report.html",data:'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貓咪嘔吐紀錄</title></head><body style="margin:0">'+buildReport()+"</body></html>"})}catch(e){}};

(async()=>{
  try{
    const dl=window.claude&&await claude.use("downloads");
    if(dl){
      DL=dl;$("vDl").style.display="block";$("export").style.display="inline-block";
      $("export").onclick=async()=>{try{await dl.save({filename:"cat-vomit-backup.json",data:JSON.stringify(entries)})}catch(e){}};
    }
  }catch(e){}
})();

setNow();chipsR();chipsV();
drawForm();render();
</script>
</body>
</html>
